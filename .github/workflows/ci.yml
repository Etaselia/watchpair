name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release-compatible PR title
        if: github.event_name == 'pull_request'
        env:
          WATCHPAIR_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-title.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit shipped dependencies
        run: |
          npm audit --omit=dev
          npx --yes pnpm@10.34.5 --dir companion audit --prod
      - name: Lint, typecheck, and unit tests
        run: npm run check
      - name: Production build and integration tests
        run: npm test
      - name: Upload companion bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: watchpair-companion
          path: public/watchpair-companion.zip
          if-no-files-found: error

  docker:
    name: Docker build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: watchpair:ci
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test production image
        shell: bash
        run: |
          docker run --detach --name watchpair-ci \
            --publish 127.0.0.1:3000:3000 \
            watchpair:ci

          cleanup() {
            docker logs watchpair-ci
            docker rm --force watchpair-ci
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done

          exit 1

  desktop:
    name: Desktop client (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            build: npx electron-builder --dir --win --x64
            executable: dist/desktop/win-unpacked/WatchPair Companion.exe
          - os: ubuntu-latest
            label: Linux
            build: npx electron-builder --dir --linux --x64
            executable: dist/desktop/linux-unpacked/watchpair-companion
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Exercise development client
        if: runner.os == 'Windows'
        run: npm run test:desktop:e2e
      - name: Exercise development client
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop:e2e
      - name: Exercise room file picker
        if: runner.os == 'Windows'
        run: npm run test:room:e2e
      - name: Exercise room file picker
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:room:e2e
      - name: Package desktop client
        run: ${{ matrix.build }}
      - name: Exercise packaged client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WATCHPAIR_DESKTOP_EXECUTABLE = "${{ matrix.executable }}"
          node tests/desktop-e2e.mjs
      - name: Exercise packaged client
        if: runner.os == 'Linux'
        env:
          WATCHPAIR_DESKTOP_EXECUTABLE: ${{ matrix.executable }}
        run: xvfb-run --auto-servernum node tests/desktop-e2e.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: watchpair-desktop-${{ runner.os }}
          path: dist/desktop/*-unpacked
          if-no-files-found: error
