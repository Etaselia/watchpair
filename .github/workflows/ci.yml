name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint, typecheck, and unit tests
        run: npm run check
      - name: Production build and integration tests
        run: npm test
      - name: Upload companion bundle
        uses: actions/upload-artifact@v7
        with:
          name: watchpair-companion
          path: public/watchpair-companion.zip
          if-no-files-found: error

  docker:
    name: Docker build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: watchpair:ci
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test production image
        shell: bash
        run: |
          docker run --detach --name watchpair-ci \
            --publish 127.0.0.1:3000:3000 \
            watchpair:ci

          cleanup() {
            docker logs watchpair-ci
            docker rm --force watchpair-ci
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done

          exit 1

  desktop:
    name: Desktop client (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            build: npx electron-builder --dir --win --x64
            executable: dist/desktop/win-unpacked/WatchPair Companion.exe
          - os: ubuntu-latest
            label: Linux
            build: npx electron-builder --dir --linux --x64
            executable: dist/desktop/linux-unpacked/watchpair-companion
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Exercise development client
        if: runner.os == 'Windows'
        run: npm run test:desktop:e2e
      - name: Exercise development client
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop:e2e
      - name: Package desktop client
        run: ${{ matrix.build }}
      - name: Exercise packaged client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WATCHPAIR_DESKTOP_EXECUTABLE = "${{ matrix.executable }}"
          node tests/desktop-e2e.mjs
      - name: Exercise packaged client
        if: runner.os == 'Linux'
        env:
          WATCHPAIR_DESKTOP_EXECUTABLE: ${{ matrix.executable }}
        run: xvfb-run --auto-servernum node tests/desktop-e2e.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: watchpair-desktop-${{ runner.os }}
          path: dist/desktop/*-unpacked
          if-no-files-found: error

  deploy:
    name: Deploy site
    if: github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: [verify, docker, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve production database
        id: database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

          database_id="$(
            npx wrangler d1 list --json |
              node --input-type=module -e '
                let input = "";
                for await (const chunk of process.stdin) input += chunk;
                const database = JSON.parse(input).find(
                  (item) => item.name === "watchpair"
                );
                if (database) process.stdout.write(database.uuid);
              '
          )"

          if [ -z "$database_id" ]; then
            npx wrangler d1 create watchpair --location weur
            for attempt in 1 2 3 4 5; do
              database_id="$(
                npx wrangler d1 list --json |
                  node --input-type=module -e '
                    let input = "";
                    for await (const chunk of process.stdin) input += chunk;
                    const database = JSON.parse(input).find(
                      (item) => item.name === "watchpair"
                    );
                    if (database) process.stdout.write(database.uuid);
                  '
              )"
              [ -n "$database_id" ] && break
              sleep "$((attempt * 2))"
            done
          fi

          test -n "$database_id"
          echo "id=$database_id" >> "$GITHUB_OUTPUT"
      - name: Configure production Worker
        env:
          WATCHPAIR_D1_DATABASE_ID: ${{ steps.database.outputs.id }}
          WATCHPAIR_WORKER_NAME: ${{ vars.WATCHPAIR_WORKER_NAME }}
        run: node scripts/write-wrangler-config.mjs
      - name: Configure voice relay
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHPAIR_ICE_SERVERS: ${{ secrets.WATCHPAIR_ICE_SERVERS }}
        run: |
          if [ -n "$WATCHPAIR_ICE_SERVERS" ]; then
            printf '%s' "$WATCHPAIR_ICE_SERVERS" |
              npx wrangler secret put WATCHPAIR_ICE_SERVERS
          fi
      - name: Publish tested commit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
