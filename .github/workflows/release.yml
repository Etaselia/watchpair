name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic version to republish, without the v prefix
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish release artifacts
    if: needs.release.outputs.release_created == 'true' || inputs.version != ''
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/etaselia/watchpair
      TAG: ${{ needs.release.outputs.tag_name || format('v{0}', inputs.version) }}
      VERSION: ${{ needs.release.outputs.version || inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha || format('v{0}', inputs.version) }}
      - id: source
        name: Resolve source revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build companion release asset
        run: |
          npm ci --no-audit --no-fund
          npm run build:companion
          sha256sum public/watchpair-companion.zip > watchpair-companion.sha256
      - name: Attach companion to GitHub release
        run: gh release upload "$TAG" public/watchpair-companion.zip watchpair-companion.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: VCS_REF=${{ steps.source.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest

  desktop-windows:
    name: Publish Windows companion
    if: needs.release.outputs.release_created == 'true' || inputs.version != ''
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag_name || format('v{0}', inputs.version) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha || format('v{0}', inputs.version) }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build Windows installer
        run: |
          npm ci --no-audit --no-fund
          npm run test:desktop:e2e
          npm run desktop:dist:win
      - name: Test packaged Windows client
        shell: pwsh
        run: |
          $env:WATCHPAIR_DESKTOP_EXECUTABLE = "dist/desktop/win-unpacked/WatchPair Companion.exe"
          node tests/desktop-e2e.mjs
      - name: Attach Windows installer and update metadata
        shell: pwsh
        run: |
          gh release upload "$env:TAG" `
            "dist/desktop/WatchPair-Companion-Windows-x64-Setup.exe" `
            "dist/desktop/WatchPair-Companion-Windows-x64-Setup.exe.blockmap" `
            "dist/desktop/latest.yml" `
            --clobber

  desktop-linux:
    name: Publish Linux companion
    if: needs.release.outputs.release_created == 'true' || inputs.version != ''
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag_name || format('v{0}', inputs.version) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha || format('v{0}', inputs.version) }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build Linux installers
        run: |
          npm ci --no-audit --no-fund
          xvfb-run --auto-servernum npm run test:desktop:e2e
          npm run desktop:dist:linux
      - name: Test packaged Linux client
        env:
          WATCHPAIR_DESKTOP_EXECUTABLE: dist/desktop/linux-unpacked/watchpair-companion
        run: xvfb-run --auto-servernum node tests/desktop-e2e.mjs
      - name: Attach Linux installers and update metadata
        run: |
          gh release upload "$TAG" \
            dist/desktop/WatchPair-Companion-Linux-x64.AppImage \
            dist/desktop/WatchPair-Companion-Linux-x64.deb \
            dist/desktop/latest-linux.yml \
            --clobber
