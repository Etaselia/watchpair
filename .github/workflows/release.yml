name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic version to republish, without the v prefix
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish release artifacts
    if: needs.release.outputs.release_created == 'true' || inputs.version != ''
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/etaselia/watchpair
      TAG: ${{ needs.release.outputs.tag_name || format('v{0}', inputs.version) }}
      VERSION: ${{ needs.release.outputs.version || inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha || format('v{0}', inputs.version) }}
      - id: source
        name: Resolve source revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build companion release asset
        run: |
          npm ci --no-audit --no-fund
          npm run build:companion
          sha256sum public/watchpair-companion.zip > watchpair-companion.sha256
      - name: Attach companion to GitHub release
        run: gh release upload "$TAG" public/watchpair-companion.zip watchpair-companion.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: VCS_REF=${{ steps.source.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest

  deploy-major:
    name: Deploy major release to VPS
    if: needs.release.outputs.release_created == 'true'
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-vps
      url: https://38-180-216-137.sslip.io:8443
    concurrency:
      group: watchpair-production-vps
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.release.outputs.version }}
      REVISION: ${{ needs.release.outputs.sha }}
    steps:
      - id: release
        name: Classify release
        shell: bash
        run: |
          if [[ "$VERSION" =~ ^[1-9][0-9]*\.0\.0$ ]]; then
            echo "major=true" >> "$GITHUB_OUTPUT"
          else
            echo "major=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION is not a major release; skipping VPS deployment."
          fi
      - if: steps.release.outputs.major == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REVISION }}
      - if: steps.release.outputs.major == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.release.outputs.major == 'true'
        name: Build AMD64 deployment image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=docker,dest=${{ runner.temp }}/watchpair-image.tar
          tags: watchpair:${{ env.VERSION }}
          build-args: VCS_REF=${{ env.REVISION }}
          cache-from: type=gha
      - if: steps.release.outputs.major == 'true'
        name: Configure deployment key
        env:
          DEPLOY_KEY: ${{ secrets.WATCHPAIR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/watchpair-deploy"
          chmod 600 "$HOME/.ssh/watchpair-deploy"
          cp ops/watchpair-known-hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - if: steps.release.outputs.major == 'true'
        name: Deploy and verify major release
        shell: bash
        run: |
          gzip -9 --stdout "${{ runner.temp }}/watchpair-image.tar" |
            ssh \
              -i "$HOME/.ssh/watchpair-deploy" \
              -p 32913 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              watchpair-ci@38.180.216.137 \
              "deploy $VERSION $REVISION"

          curl --fail --silent --show-error --max-time 15 \
            https://38-180-216-137.sslip.io:8443/api/health
