name: Build deployment image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AMD64 archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=docker,dest=${{ runner.temp }}/watchpair-image.tar
          tags: watchpair:0.5.4
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compress and checksum archive
        working-directory: ${{ runner.temp }}
        run: |
          gzip -9 watchpair-image.tar
          sha256sum watchpair-image.tar.gz > watchpair-image.tar.gz.sha256
      - name: Upload deployment archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: watchpair-amd64-image
          path: |
            ${{ runner.temp }}/watchpair-image.tar.gz
            ${{ runner.temp }}/watchpair-image.tar.gz.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
