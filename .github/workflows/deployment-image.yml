name: Build deployment image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AMD64 archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=docker,dest=${{ runner.temp }}/watchpair-image.tar
          tags: watchpair:0.5.4
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compress and checksum archive
        working-directory: ${{ runner.temp }}
        run: |
          gzip -9 watchpair-image.tar
          sha256sum watchpair-image.tar.gz > watchpair-image.tar.gz.sha256
      - name: Upload deployment archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: watchpair-amd64-image
          path: |
            ${{ runner.temp }}/watchpair-image.tar.gz
            ${{ runner.temp }}/watchpair-image.tar.gz.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
